# 打 tag 自动构建并发布 GitHub Release。
# 触发条件：v1.0.0 格式的 tag（在 validate 步骤用正则严格校验，
# Actions 的 tag 过滤是 glob 语法，写不了 v[0-9]+.[0-9]+.[0-9]+ 这种正则）。
# 产物：scoop-gh-<版本>-<架构>.zip（内含 scoop-gh.exe 与 README.md），amd64 / arm64 各一份。
# 版本号与构建时间经 -ldflags -X 注入，与 build.bat 相同。

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 发布 Release 必需

jobs:
  release:
    runs-on: ubuntu-latest # 纯 Go 交叉编译，linux runner 更快

    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag and get version
        id: version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' 不符合 v1.0.0 格式，不发布"
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build windows/${{ matrix.arch }}
        env:
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          BUILD_TIME=$(date +%Y-%m-%d_%H:%M:%S)
          mkdir -p dist/${{ matrix.arch }}
          go build -trimpath \
            -ldflags "-s -w -X github.com/jqk/scoop-gh-proxy/internal/cli.Version=${{ steps.version.outputs.version }} -X github.com/jqk/scoop-gh-proxy/internal/cli.BuildTime=${BUILD_TIME}" \
            -o dist/${{ matrix.arch }}/scoop-gh.exe .
          cp README.md dist/${{ matrix.arch }}/

      - name: Package zip
        run: |
          cd dist/${{ matrix.arch }}
          zip "scoop-gh-${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip" scoop-gh.exe README.md
          mv "scoop-gh-${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip" ../..

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: scoop-gh-*.zip
          generate_release_notes: true
